TIMEOUT=5
DEFAULT_ENTRY=CITADEL_DEV_TERM_RECOVERY

:CITADEL
    PROTOCOL=limine
    KERNEL_PATH=boot/citadel.elf
    CMDLINE=citadel
    MODULE_PATH=modules/ramdisk.img
    MODULE_CMDLINE=ramdisk

:CITADEL_TERMINAL
    PROTOCOL=limine
    KERNEL_PATH=boot/citadel.elf
    CMDLINE=citadel citadel.mode=TERMINAL
    MODULE_PATH=modules/ramdisk.img
    MODULE_CMDLINE=ramdisk

:CITADEL_DEV_TERM_RECOVERY
    PROTOCOL=limine
    KERNEL_PATH=boot/citadel.elf
    CMDLINE=citadel citadel.mode=TERMINAL citadel.recovery_code=citadel123 loglevel=debug
    MODULE_PATH=modules/ramdisk.img
    MODULE_CMDLINE=ramdisk

:CITADEL_RECOVERY
    PROTOCOL=limine
    KERNEL_PATH=boot/citadel.elf
    CMDLINE=citadel citadel.mode=RECOVERY
    MODULE_PATH=modules/ramdisk.img
    MODULE_CMDLINE=ramdisk

