timeout: 3

/CITADEL Kernel
    protocol: limine
    kernel_path: boot():/boot/citadel.elf
    cmdline: citadel quiet
    module_path: boot():/modules/ramdisk.img
    module_cmdline: ramdisk

/CITADEL (Terminal)
    protocol: limine
    kernel_path: boot():/boot/citadel.elf
    cmdline: citadel citadel.mode=TERMINAL quiet
    module_path: boot():/modules/ramdisk.img
    module_cmdline: ramdisk

/CITADEL (Recovery)
    protocol: limine
    kernel_path: boot():/boot/citadel.elf
    cmdline: citadel citadel.mode=RECOVERY quiet
    module_path: boot():/modules/ramdisk.img
    module_cmdline: ramdisk
