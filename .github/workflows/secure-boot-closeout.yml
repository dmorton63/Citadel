name: "secure_boot_closeout"
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  closeout-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify closeout package
        run: |
          python3 tools/verify_secure_boot_closeout.py \
            --policy config/secure_boot_sustainment_gate.json \
            --json-out build/closeout/closeout_verification.json
