name: Secure Boot Nightly Regression

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  BUILD_DIR: build
  KEY_DIR: /tmp/citadel-nightly-keys

jobs:
  nightly-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          export APT_LISTCHANGES_FRONTEND=none
          sudo apt-get update -qq
          sudo -E apt-get install -y -qq -o Dpkg::Use-Pty=0 cmake build-essential nasm openssl python3

      - name: Configure and build
        run: |
          cmake -B $BUILD_DIR -DENABLE_SECURE_BOOT=ON -DSECURE_BOOT_ENVIRONMENT=lab
          cmake --build $BUILD_DIR --parallel

      - name: Generate ephemeral keys
        run: |
          mkdir -p $KEY_DIR
          for KEY_ID in CITADEL_BOOT_LAB_v1 CITADEL_LSK_LAB_v1 CITADEL_KSK_LAB_v1 CITADEL_MSK_LAB_v1; do
            openssl req -x509 -newkey rsa:2048 -sha256 \
              -keyout $KEY_DIR/${KEY_ID}.pem \
              -out    $KEY_DIR/${KEY_ID}.crt \
              -days 1 -nodes -subj "/CN=${KEY_ID}"
          done

      - name: Stage boot artifacts for signing
        run: |
          # CMake builds the kernel ELF; Limine EFI and boot.json live in the
          # repo tree. Copy them into $BUILD_DIR so the signing step has a
          # single, predictable location to search.
          STAGE="$BUILD_DIR/signing-stage"
          mkdir -p "$STAGE"

          # Limine UEFI binary (x86-64)
          [[ -f "limine/BOOTX64.EFI"        ]] && cp "limine/BOOTX64.EFI"        "$STAGE/Limine.efi"
          [[ -f "iso/EFI/BOOT/BOOTX64.EFI"  ]] && cp "iso/EFI/BOOT/BOOTX64.EFI" "$STAGE/Limine.efi"

          # Kernel image produced by CMake
          [[ -f "$BUILD_DIR/kernel/citadel.elf" ]] && cp "$BUILD_DIR/kernel/citadel.elf" "$STAGE/vmlinuz-citadel"
          [[ -f "iso/boot/citadel.elf"          ]] && cp "iso/boot/citadel.elf"           "$STAGE/vmlinuz-citadel"

          # Boot policy config
          [[ -f "boot.json" ]] && cp "boot.json" "$STAGE/boot.json"

          # BootGate binary
          if   [[ -f "$BUILD_DIR/BootGate"           ]]; then cp "$BUILD_DIR/BootGate"           "$STAGE/BootGate"
          elif [[ -f "$BUILD_DIR/citadel.bin"        ]]; then cp "$BUILD_DIR/citadel.bin"        "$STAGE/BootGate"
          elif [[ -f "$BUILD_DIR/kernel/citadel.bin" ]]; then cp "$BUILD_DIR/kernel/citadel.bin" "$STAGE/BootGate"
          fi

          echo "Staged signing artifacts:"
          ls -lh "$STAGE"

      - name: Sign artifacts and manifest
        run: |
          if [[ ! -f "$BUILD_DIR/signing-stage/BootGate" ]]; then
            echo "Missing BootGate in signing-stage — check 'Stage boot artifacts' step above."
            exit 1
          fi

          mapfile -d '' ARTIFACTS < <(
            find "$BUILD_DIR/signing-stage" -type f \( \
              -iname "*.efi" -o -iname "bootgate" -o -iname "vmlinuz*" -o -iname "boot.json" -o -name "*.ko" \
            \) -print0 | sort -z
          )

          if [[ ${#ARTIFACTS[@]} -eq 0 ]]; then
            echo "No signable artifacts staged — check 'Stage boot artifacts' step above."
            exit 1
          fi

          python3 tools/sign_artifacts.py \
            --environment lab \
            --key-dir $KEY_DIR \
            --artifacts "${ARTIFACTS[@]}" \
            --manifest-out $BUILD_DIR/secure-boot-manifest-nightly.json \
            --signer "nightly@citadel"

      - name: Verify + provenance + stale-key checks
        run: |
          python3 tools/verify_signatures.py --environment lab --key-dir $KEY_DIR --manifest $BUILD_DIR/secure-boot-manifest-nightly.json --strict
          python3 tools/check_provenance.py --manifest $BUILD_DIR/secure-boot-manifest-nightly.json --build-dir $BUILD_DIR --source-dir .
          python3 tools/stale_key_report.py --key-dir $KEY_DIR --manifest-dir $BUILD_DIR --out $BUILD_DIR/stale-key-report.json

      - name: Build nightly run summary
        run: |
          FAIL=0
          TOTAL=6
          test -f $BUILD_DIR/secure-boot-manifest-nightly.json || FAIL=$((FAIL+1))
          test -f $BUILD_DIR/stale-key-report.json || FAIL=$((FAIL+1))
          # lightweight success model for trending
          cat > $BUILD_DIR/nightly-run.json <<EOF
          {
            "date": "$(date -u +%Y-%m-%d)",
            "total": ${TOTAL},
            "passed": $((TOTAL-FAIL)),
            "failed": ${FAIL},
            "critical_failed": ${FAIL},
            "duration_sec": 0
          }
          EOF

      - name: Update trend and enforce thresholds
        run: |
          python3 tools/nightly_regression_report.py \
            --run $BUILD_DIR/nightly-run.json \
            --trend $BUILD_DIR/nightly-trend.json \
            --max-fail-rate 0.02 \
            --max-critical 0

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secure-boot-nightly-${{ github.run_id }}
          path: |
            ${{ env.BUILD_DIR }}/secure-boot-manifest-nightly.json
            ${{ env.BUILD_DIR }}/nightly-run.json
            ${{ env.BUILD_DIR }}/nightly-trend.json
            ${{ env.BUILD_DIR }}/stale-key-report.json
          retention-days: 30
