## MODE=TERMINAL
MODE=DESKTOP
## MODE SAFE
## MODE RECOVERY
## MODE INSTALLER
## MODE NETWORK

## SECURITY CENTER MODE
## SC_MODE=BYPASS   (default)
SC_MODE=ENFORCE
## SC_MODE=BYPASS

## STORAGE (QEMU shared folder)
## IDE_SHARED=1 enables probing legacy IDE for a FAT16/FAT32 volume and mounting it at /shared.
## IDE_SHARED=0 disables the probe (default).
IDE_SHARED=1

## SHARED_SOURCE controls what /shared should point to on boot.
## SHARED_SOURCE=RAMDISK keeps /shared on the ramdisk (default behavior).
## SHARED_SOURCE=USB prefers the first removable USB FAT volume for /shared.
## In USB mode, IDE_SHARED probing is ignored for the current boot.
SHARED_SOURCE=USB
## SHARED_USB_INDEX selects which removable USB volume maps to /shared when SHARED_SOURCE=USB.
## 0=first removable USB, 1=second removable USB, etc.
## AUTO=prefer first removable USB that does not look like Citadel boot media.
SHARED_USB_INDEX=AUTO

## CONSOLE TRANSCRIPT
## SAVETERM=0 disables boot-time dump
## SAVETERM=1 dumps to /shared/citadel.txt once /shared is mounted
## SAVETERM=<name> dumps to /shared/<name>
## SAVETERM=/shared/<path> dumps to that absolute /shared path
SAVETERM=0

## POWEROFF_AFTER_SAVETERM=1 requests ACPI poweroff after SAVETERM completes
POWEROFF_AFTER_SAVETERM=0

## TPM Quarantine testing
## TPM_QUARANTINE_TEST=1 enables the dev-only TPM quarantine test path on boot.
TPM_QUARANTINE_TEST=0
